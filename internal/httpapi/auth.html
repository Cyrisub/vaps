<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAPS Auth Browser</title>
  <link rel="stylesheet" href="/dashboard/static/dashboard.css">
  <script src="/dashboard/static/dashboard.js" defer></script>
  <style>
    form {
      display: grid;
      grid-template-columns: 2fr repeat(3, minmax(120px, 1fr)) auto;
      gap: 12px;
      align-items: end;
    }
    table { min-width: 980px; }
    @media (max-width: 960px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="auth">
  <section class="vaps-sector">
    <h1>Auth Browser</h1>
    <p class="subtitle">Issued auth tokens, recent error counts, and cleanup actions.</p>
  </section>

  <section class="vaps-sector">
    <h2>Filters</h2>
    <div class="panel">
      <form id="filters">
        <label>
          Hash prefix
          <input id="hash" name="hash" autocomplete="off" placeholder="token hash prefix">
        </label>
        <label>
          Client ID
          <input id="client_id" name="client_id" autocomplete="off" placeholder="client id contains">
        </label>
        <label>
          Status
          <select id="status" name="status">
            <option value="">All</option>
            <option value="active">Active</option>
            <option value="expired">Expired</option>
            <option value="revoked">Revoked</option>
          </select>
        </label>
        <label>
          Limit
          <input id="limit" name="limit" type="number" min="1" max="500" value="100" inputmode="numeric">
        </label>
        <button type="submit">Search</button>
      </form>
    </div>
  </section>

  <section class="vaps-sector">
    <h2>Results</h2>
    <div class="panel">
      <div class="toolbar">
        <p class="hint" id="summary">Loading auth tokens...</p>
        <div class="pager">
          <button id="clear-expired" type="button">Clear Expired</button>
          <button id="clear-all" type="button">Clear All</button>
          <button id="prev" type="button">Previous</button>
          <button id="next" type="button">Next</button>
        </div>
      </div>
      <p class="error" id="error"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Hash</th>
              <th>Client</th>
              <th>Project</th>
              <th>System</th>
              <th>Status</th>
              <th>Remote IP</th>
              <th>Created</th>
              <th>Expires</th>
              <th>Revoked</th>
              <th>Errors</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <div id="token-modal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="token-modal-title">
      <div class="modal-header">
        <h2 id="token-modal-title">Token Info</h2>
        <button id="token-modal-close" class="modal-close" type="button">Close</button>
      </div>
      <pre id="token-modal-body">{}</pre>
    </div>
  </div>

  <script>
    const state = { offset: 0, items: [] };
    const form = document.getElementById("filters");
    const rows = document.getElementById("rows");
    const summary = document.getElementById("summary");
    const error = document.getElementById("error");
    const modal = document.getElementById("token-modal");
    const modalBody = document.getElementById("token-modal-body");
    const value = (id) => document.getElementById(id).value.trim();
    const escapeText = (text) => {
      const span = document.createElement("span");
      span.textContent = text;
      return span.innerHTML;
    };
    const formatDateTime = (value) => {
      if (!value) return "";
      return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "medium" }).format(new Date(value));
    };
    const formatRemoteIP = (ip) => {
      const value = String(ip || "").trim().replace(/^\[|\]$/g, "");
      if (!value) return "";
      const lower = value.toLowerCase();
      if (lower === "::1" || lower === "127.0.0.1" || lower === "::ffff:127.0.0.1" || lower === "localhost") {
        return "localhost";
      }
      return value;
    };
    const projectLabel = (item) => {
      const info = item.user_agent_info || {};
      if (!info.parsed) {
        return item.user_agent
          ? `<span class="hint" title="${escapeText(item.user_agent)}">unparsed</span>`
          : '<span class="hint">none</span>';
      }
      const engine = info.engine ? ` <span class="hint">${escapeText(info.engine)}</span>` : "";
      return `<strong>${escapeText(info.project || "")}</strong>${engine}`;
    };
    const systemLabel = (item) => {
      const info = item.user_agent_info || {};
      if (!info.parsed) {
        return item.user_agent
          ? `<code title="${escapeText(item.user_agent)}">${escapeText(item.user_agent.slice(0, 48))}</code>`
          : '<span class="hint">none</span>';
      }
      const detail = info.system_detail ? ` <span class="hint">${escapeText(info.system_detail)}</span>` : "";
      return `${escapeText(info.system || "")}${detail}`;
    };

    function buildParams() {
      const params = new URLSearchParams();
      for (const id of ["hash", "client_id", "status", "limit"]) {
        const current = value(id);
        if (current) params.set(id, current);
      }
      params.set("offset", String(state.offset));
      return params;
    }

    function openTokenInfo(index) {
      const item = state.items[index];
      if (!item) return;
      modalBody.textContent = JSON.stringify(item, null, 2);
      modal.hidden = false;
    }

    function closeTokenInfo() {
      modal.hidden = true;
    }

    async function load() {
      error.textContent = "";
      const response = await fetch(`/dashboard/auth/query?${buildParams()}`);
      if (!response.ok) throw new Error(await response.text());
      render(await response.json());
    }

    function render(data) {
      const items = data.items || [];
      state.items = items;
      const limit = data.limit || Number(value("limit")) || 100;
      rows.innerHTML = items.map((item, index) => `
        <tr>
          <td><button class="linkish" type="button" data-token-index="${index}"><code>${escapeText(item.hash_prefix || "")}</code></button></td>
          <td>${escapeText(item.client_id || "")}</td>
          <td title="${escapeText(item.user_agent || "")}">${projectLabel(item)}</td>
          <td title="${escapeText(item.user_agent || "")}">${systemLabel(item)}</td>
          <td><span class="pill ${escapeText(item.status || "")}">${escapeText(item.status || "")}</span></td>
          <td class="nowrap">${escapeText(formatRemoteIP(item.remote_ip))}</td>
          <td class="nowrap">${escapeText(formatDateTime(item.created_at))}</td>
          <td class="nowrap">${escapeText(formatDateTime(item.expires_at))}</td>
          <td class="nowrap">${escapeText(formatDateTime(item.revoked_at))}</td>
          <td>${item.error_count > 0
            ? `<a href="/dashboard/errors?token_hash=${encodeURIComponent(item.token_hash)}">${escapeText(String(item.error_count))}</a>`
            : "0"}</td>
        </tr>
      `).join("");
      if (items.length === 0) {
        rows.innerHTML = '<tr><td colspan="10" class="hint">No auth tokens matched the query.</td></tr>';
      }
      rows.querySelectorAll("[data-token-index]").forEach((button) => {
        button.addEventListener("click", () => openTokenInfo(Number(button.getAttribute("data-token-index"))));
      });
      const start = data.total === 0 ? 0 : data.offset + 1;
      const end = data.offset + items.length;
      summary.textContent = `Showing ${start}-${end} of ${data.total} tokens`;
      document.getElementById("prev").disabled = data.offset <= 0;
      document.getElementById("next").disabled = data.offset + limit >= data.total;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      state.offset = 0;
      load().catch((err) => { error.textContent = err.message; });
    });
    async function clearTokens(path, confirmMessage) {
      if (!window.confirm(confirmMessage)) return;
      error.textContent = "";
      const response = await fetch(path, { method: "POST" });
      if (!response.ok) throw new Error(await response.text());
      const result = await response.json();
      summary.textContent = `Deleted ${result.deleted || 0} token(s)`;
      state.offset = 0;
      await load();
    }

    document.getElementById("clear-expired").addEventListener("click", () => {
      clearTokens("/dashboard/auth/clear-expired", "Delete all expired tokens from the auth database?").catch((err) => {
        error.textContent = err.message;
      });
    });
    document.getElementById("clear-all").addEventListener("click", () => {
      clearTokens("/dashboard/auth/clear-all", "Delete ALL auth tokens? Active clients will need to request new tokens.").catch((err) => {
        error.textContent = err.message;
      });
    });
    document.getElementById("prev").addEventListener("click", () => {
      const limit = Number(value("limit")) || 100;
      state.offset = Math.max(0, state.offset - limit);
      load().catch((err) => { error.textContent = err.message; });
    });
    document.getElementById("next").addEventListener("click", () => {
      const limit = Number(value("limit")) || 100;
      state.offset += limit;
      load().catch((err) => { error.textContent = err.message; });
    });
    document.getElementById("token-modal-close").addEventListener("click", closeTokenInfo);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeTokenInfo();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !modal.hidden) closeTokenInfo();
    });

    load().catch((err) => { error.textContent = err.message; });
  </script>
</body>
</html>
