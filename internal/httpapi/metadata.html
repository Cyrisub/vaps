<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAPS Payloads</title>
  <link rel="stylesheet" href="/dashboard/static/dashboard.css">
  <script src="/dashboard/static/dashboard.js" defer></script>
  <style>
    form {
      display: grid;
      grid-template-columns: 2fr repeat(4, minmax(120px, 1fr)) auto;
      gap: 12px;
      align-items: end;
    }
    table { min-width: 720px; }
    th.sortable {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th.sortable:hover { color: var(--theme_p0); }
    th.sortable .sort-indicator {
      margin-left: 4px;
      color: var(--theme_ln);
      font-weight: 600;
    }
    th.sortable:not(.sorted) .sort-indicator { visibility: hidden; }
    .payload-row:hover td { background: var(--theme_p4); }
    .payload-row.selected td { background: var(--theme_g2); }
    .payload-status { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    @media (max-width: 960px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="metadata">
  <section class="vaps-sector">
    <h1>Payloads</h1>
    <p class="subtitle">Read-only query view over payload metadata records.</p>
  </section>

  <section class="vaps-sector">
    <h2>Filters</h2>
    <div class="panel">
      <form id="filters">
        <label>
          Hash contains
          <input id="q" name="q" autocomplete="off" placeholder="sha1 hash or prefix">
        </label>
        <label>
          Status
          <select id="status" name="status">
            <option value="">All</option>
            <option value="local">Local</option>
            <option value="cache">Cache</option>
          </select>
        </label>
        <label>
          Min size
          <input id="min_size" name="min_size" type="number" min="0" inputmode="numeric">
        </label>
        <label>
          Max size
          <input id="max_size" name="max_size" type="number" min="0" inputmode="numeric">
        </label>
        <label>
          Limit
          <input id="limit" name="limit" type="number" min="1" max="500" value="100" inputmode="numeric">
        </label>
        <button type="submit">Search</button>
      </form>
    </div>
  </section>

  <section class="vaps-sector">
    <h2>Results</h2>
    <div class="panel">
      <div class="toolbar">
        <p class="hint" id="summary">Loading payload records...</p>
        <div class="pager">
          <button id="prev" type="button">Previous</button>
          <button id="next" type="button">Next</button>
        </div>
      </div>
      <p class="error" id="error"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Hash</th>
              <th class="sortable" data-sort="size" id="sort-size" title="Sort by size" aria-sort="none">
                Size<span class="sort-indicator" aria-hidden="true"></span>
              </th>
              <th>Status</th>
              <th class="sortable sorted" data-sort="created" id="sort-created" title="Sort by created time" aria-sort="descending">
                Created<span class="sort-indicator" aria-hidden="true">↓</span>
              </th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <div class="modal-backdrop" id="detail-modal" hidden role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="detail-title">Payload Metadata</h2>
        <button class="modal-close" id="detail-close" type="button">Close</button>
      </div>
      <p class="error" id="detail-error"></p>
      <pre id="detail-body">{}</pre>
    </div>
  </div>

  <script>
    const state = { offset: 0, sort: "created", order: "desc", items: [], selected: "" };
    const form = document.getElementById("filters");
    const rows = document.getElementById("rows");
    const summary = document.getElementById("summary");
    const error = document.getElementById("error");
    const detailModal = document.getElementById("detail-modal");
    const detailTitle = document.getElementById("detail-title");
    const detailError = document.getElementById("detail-error");
    const detailBody = document.getElementById("detail-body");
    const detailClose = document.getElementById("detail-close");

    const value = (id) => document.getElementById(id).value.trim();
    const formatBytes = (value) => {
      const unit = 1024;
      if (value < unit) return `${value} B`;
      const units = ["KiB", "MiB", "GiB", "TiB", "PiB"];
      let scaled = value / unit;
      let index = 0;
      while (scaled >= unit && index < units.length - 1) {
        scaled /= unit;
        index += 1;
      }
      return `${scaled.toFixed(1)} ${units[index]}`;
    };
    const formatDateTime = (value) => {
      if (!value) return "";
      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "medium"
      }).format(new Date(value));
    };
    const escapeText = (text) => {
      const span = document.createElement("span");
      span.textContent = text;
      return span.innerHTML;
    };
    const statusPills = (flags) => {
      return Object.entries(flags || {})
        .filter((entry) => entry[1])
        .map((entry) => `<span class="pill">${escapeText(entry[0])}</span>`)
        .join("");
    };

    function updateSortHeaders() {
      for (const header of document.querySelectorAll("th.sortable")) {
        const active = header.dataset.sort === state.sort;
        const indicator = header.querySelector(".sort-indicator");
        header.classList.toggle("sorted", active);
        header.setAttribute("aria-sort", active ? (state.order === "asc" ? "ascending" : "descending") : "none");
        indicator.textContent = active ? (state.order === "asc" ? "↑" : "↓") : "";
      }
    }

    function buildParams() {
      const params = new URLSearchParams();
      for (const id of ["q", "status", "min_size", "max_size", "limit"]) {
        const current = value(id);
        if (current) params.set(id, current);
      }
      params.set("sort", state.sort);
      params.set("order", state.order);
      params.set("offset", String(state.offset));
      return params;
    }

    async function load() {
      error.textContent = "";
      updateSortHeaders();
      const response = await fetch(`/dashboard/metadata/query?${buildParams()}`);
      if (!response.ok) throw new Error(await response.text());
      const data = await response.json();
      render(data);
    }

    function render(data) {
      const items = data.items || [];
      state.items = items;
      const limit = data.limit || Number(value("limit")) || 100;
      rows.innerHTML = items.map((item) => `
        <tr class="payload-row${item.hash === state.selected ? " selected" : ""}" data-payload-hash="${escapeText(item.hash)}">
          <td><button class="linkish" type="button" data-payload-hash="${escapeText(item.hash)}">${escapeText(item.hash)}</button></td>
          <td>${escapeText(item.size_human || formatBytes(item.size || 0))}</td>
          <td><div class="payload-status"><span class="pill">${escapeText(item.status_label || "unknown")}</span>${statusPills(item.status_flags)}</div></td>
          <td>${escapeText(formatDateTime(item.created_at))}</td>
        </tr>
      `).join("");
      if (items.length === 0) {
        rows.innerHTML = '<tr><td colspan="4" class="hint">No payload records matched the query.</td></tr>';
      }
      rows.querySelectorAll("button[data-payload-hash]").forEach((button) => {
        button.addEventListener("click", () => selectPayload(button.dataset.payloadHash));
      });
      const start = data.total === 0 ? 0 : data.offset + 1;
      const end = data.offset + items.length;
      summary.textContent = `Showing ${start}-${end} of ${data.total} records`;
      document.getElementById("prev").disabled = data.offset <= 0;
      document.getElementById("next").disabled = data.offset + limit >= data.total;
    }

    async function selectPayload(hash) {
      const item = state.items.find((candidate) => candidate.hash === hash);
      if (!item) return;
      state.selected = hash;
      detailTitle.textContent = `Payload Metadata · ${hash}`;
      detailError.textContent = "";
      detailBody.textContent = "Loading...";
      detailModal.hidden = false;
      rows.querySelectorAll("tr[data-payload-hash]").forEach((row) => {
        row.classList.toggle("selected", row.dataset.payloadHash === hash);
      });
      try {
        const response = await fetch(`/dashboard/metadata/detail?hash=${encodeURIComponent(hash)}`);
        if (!response.ok) throw new Error(await response.text());
        const payload = await response.json();
        detailBody.textContent = JSON.stringify(payload, null, 2);
      } catch (err) {
        detailError.textContent = err.message;
        detailBody.textContent = "";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      state.offset = 0;
      load().catch((err) => { error.textContent = err.message; });
    });
    document.getElementById("prev").addEventListener("click", () => {
      const limit = Number(value("limit")) || 100;
      state.offset = Math.max(0, state.offset - limit);
      load().catch((err) => { error.textContent = err.message; });
    });
    document.getElementById("next").addEventListener("click", () => {
      const limit = Number(value("limit")) || 100;
      state.offset += limit;
      load().catch((err) => { error.textContent = err.message; });
    });
    for (const header of document.querySelectorAll("th.sortable")) {
      header.addEventListener("click", () => {
        const nextSort = header.dataset.sort;
        if (state.sort === nextSort) {
          state.order = state.order === "asc" ? "desc" : "asc";
        } else {
          state.sort = nextSort;
          state.order = "desc";
        }
        state.offset = 0;
        load().catch((err) => { error.textContent = err.message; });
      });
    }
    detailClose.addEventListener("click", () => {
      detailModal.hidden = true;
    });
    detailModal.addEventListener("click", (event) => {
      if (event.target === detailModal) detailModal.hidden = true;
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") detailModal.hidden = true;
    });

    updateSortHeaders();
    load().catch((err) => { error.textContent = err.message; });
  </script>
</body>
</html>
