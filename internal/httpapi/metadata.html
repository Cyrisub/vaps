<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAPS Metadata Browser</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(20, 28, 52, 0.84);
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #e5edf7;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #f87171;
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI Variable", "Segoe UI", Roboto, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.20), transparent 34rem),
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.16), transparent 30rem),
        var(--bg);
    }
    main {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      margin-bottom: 24px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 600;
      line-height: 1;
    }
    a { color: var(--accent); }
    .subtitle, .hint, label {
      color: var(--muted);
    }
    .subtitle {
      margin: 0;
      font-size: 16px;
    }
    .panel {
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      padding: 24px;
      margin-top: 16px;
    }
    form {
      display: grid;
      grid-template-columns: 2fr repeat(5, minmax(120px, 1fr));
      gap: 14px;
      align-items: end;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    input, select, button {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      background: rgba(2, 6, 23, 0.72);
      font: inherit;
    }
    button {
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(34, 197, 94, 0.30));
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }
    .pager {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .pager button {
      min-width: 90px;
    }
    .error {
      color: var(--danger);
      white-space: pre-wrap;
    }
    .table-wrap {
      overflow: auto;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.14);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    td {
      font-variant-numeric: tabular-nums;
    }
    code {
      color: #dbeafe;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      word-break: break-all;
    }
    .pill {
      display: inline-block;
      margin: 0 6px 6px 0;
      border-radius: 999px;
      padding: 4px 8px;
      color: #dbeafe;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.24);
      font-size: 12px;
    }
    @media (max-width: 960px) {
      .hero, .toolbar { display: block; }
      form { grid-template-columns: 1fr; }
      .pager { margin-top: 12px; }
      main { padding: 28px 0; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>
        <div class="eyebrow">Virtual Asset Payload Storage</div>
        <h1>Metadata Browser</h1>
        <p class="subtitle">Read-only query view over the bbolt metadata database.</p>
      </div>
      <a href="/dashboard">Back to Dashboard</a>
    </section>

    <section class="panel">
      <form id="filters">
        <label>
          Hash contains
          <input id="q" name="q" autocomplete="off" placeholder="sha1 hash or prefix">
        </label>
        <label>
          Status
          <select id="status" name="status">
            <option value="">All</option>
            <option value="local">Local</option>
            <option value="cache">Cache</option>
            <option value="corrupt">Corrupt</option>
            <option value="readonly">Readonly</option>
          </select>
        </label>
        <label>
          Backup
          <select id="backup" name="backup">
            <option value="">All</option>
            <option value="none">None</option>
            <option value="pending">Pending</option>
            <option value="backuped">Backuped</option>
            <option value="failed">Failed</option>
          </select>
        </label>
        <label>
          Min size
          <input id="min_size" name="min_size" type="number" min="0" inputmode="numeric">
        </label>
        <label>
          Max size
          <input id="max_size" name="max_size" type="number" min="0" inputmode="numeric">
        </label>
        <label>
          Limit
          <input id="limit" name="limit" type="number" min="1" max="500" value="100" inputmode="numeric">
        </label>
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="panel">
      <div class="toolbar">
      <p class="hint" id="summary">Loading metadata records...</p>
        <div class="pager">
          <button id="prev" type="button">Previous</button>
          <button id="next" type="button">Next</button>
        </div>
      </div>
      <p class="error" id="error"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Hash</th>
              <th>Size</th>
              <th>Status</th>
              <th>Backup</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const state = { offset: 0 };
    const form = document.getElementById("filters");
    const rows = document.getElementById("rows");
    const summary = document.getElementById("summary");
    const error = document.getElementById("error");

    const value = (id) => document.getElementById(id).value.trim();
    const formatBytes = (value) => {
      const unit = 1024;
      if (value < unit) return `${value} B`;
      const units = ["KiB", "MiB", "GiB", "TiB", "PiB"];
      let scaled = value / unit;
      let index = 0;
      while (scaled >= unit && index < units.length - 1) {
        scaled /= unit;
        index += 1;
      }
      return `${scaled.toFixed(1)} ${units[index]}`;
    };
    const formatDateTime = (value) => {
      if (!value) return "";
      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "medium"
      }).format(new Date(value));
    };
    const escapeText = (text) => {
      const span = document.createElement("span");
      span.textContent = text;
      return span.innerHTML;
    };
    const statusPills = (flags) => {
      return Object.entries(flags || {})
        .filter((entry) => entry[1])
        .map((entry) => `<span class="pill">${escapeText(entry[0])}</span>`)
        .join("") || '<span class="hint">none</span>';
    };

    function buildParams() {
      const params = new URLSearchParams();
      for (const id of ["q", "status", "backup", "min_size", "max_size", "limit"]) {
        const current = value(id);
        if (current) params.set(id, current);
      }
      params.set("offset", String(state.offset));
      return params;
    }

    async function load() {
      error.textContent = "";
      const response = await fetch(`/dashboard/metadata/query?${buildParams()}`);
      if (!response.ok) throw new Error(await response.text());
      const data = await response.json();
      render(data);
    }

    function render(data) {
      const items = data.items || [];
      const limit = data.limit || Number(value("limit")) || 100;
      rows.innerHTML = items.map((item) => `
        <tr>
          <td><code>${escapeText(item.hash)}</code></td>
          <td>${escapeText(item.size_human || formatBytes(item.size || 0))}</td>
          <td>${statusPills(item.status_flags)}</td>
          <td>${escapeText(item.backup)}</td>
          <td>${escapeText(formatDateTime(item.created_at))}</td>
        </tr>
      `).join("");
      if (items.length === 0) {
        rows.innerHTML = '<tr><td colspan="5" class="hint">No metadata records matched the query.</td></tr>';
      }
      const start = data.total === 0 ? 0 : data.offset + 1;
      const end = data.offset + items.length;
      summary.textContent = `Showing ${start}-${end} of ${data.total} records`;
      document.getElementById("prev").disabled = data.offset <= 0;
      document.getElementById("next").disabled = data.offset + limit >= data.total;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      state.offset = 0;
      load().catch((err) => { error.textContent = err.message; });
    });
    document.getElementById("prev").addEventListener("click", () => {
      const limit = Number(value("limit")) || 100;
      state.offset = Math.max(0, state.offset - limit);
      load().catch((err) => { error.textContent = err.message; });
    });
    document.getElementById("next").addEventListener("click", () => {
      const limit = Number(value("limit")) || 100;
      state.offset += limit;
      load().catch((err) => { error.textContent = err.message; });
    });

    load().catch((err) => { error.textContent = err.message; });
  </script>
</body>
</html>
