# vaps default configuration (TOML v1.1.0)
#:tombi toml-version = "v1.1.0"

addr = ":8588"
data_dir = "data"
metadata_db = "data/metadata.db"
auth_db = "data/auth.db"
upload_db = "data/uploads.db"
log_dir = "logs"
log_retention_days = 7
status_log_interval = "1m"

[metadata]
# -1 uses physical CPU cores; 0 forces single-threaded validation.
workers = -1
# Timeout for each S3 HEAD request.
timeout = "10s"
progress_interval = "10s"

[cache]
bytes = "0"
max_object_bytes = "4MiB"

[auth]
# Deprecated compatibility setting; source tokens never expire.
expire_time = "0s"

[upload]
direct_max_bytes = "8MiB"
expiration = "24h"
cleanup_interval = "1m"
dir = "data/uploads"

[dashboard]
info_refresh_interval = "5s"

[storage]
# A durable local outbox for new uploads to additional persistent backends.
replication_dir = "data/replication"
replication_workers = 4
replication_retry_interval = "10s"

[storage.s3]
bucket = "vaps-payloads"
region = "us-east-1"
endpoint = ""
prefix = "payloads"
force_path_style = false

[storage.local]
dir = "data"
max_cache_bytes = "100GiB"

# Optional ordered persistent backends. When present, these replace storage.s3.
# Upload success requires the first backend and the durable local outbox.
# Additional backends are written asynchronously with persistent retries.
# Reads fall back in order. Existing objects are not scanned or copied.
# Preserve the name "s3" for an existing legacy S3 backend's ETag scope.
# [[storage.backends]]
# name = "s3"
# type = "s3"
# [storage.backends.s3]
# bucket = "vaps-payloads"
# region = "us-east-1"
# endpoint = "https://s3.example.com"
# prefix = "payloads"
#
# [[storage.backends]]
# name = "smb"
# type = "filesystem"
# dir = "/mnt/vaps-smb/vaps-payloads"
# mount_source = "//server/share" # Linux: refuse access unless this SMB share is mounted.
