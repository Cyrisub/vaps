name: Release cleanup

on:
  delete:

permissions:
  contents: write

jobs:
  delete-release:
    name: Delete release for removed tag
    if: github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Match release tag pattern
        id: tag
        env:
          REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          tag="${REF#refs/tags/}"
          if ! echo "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'; then
            echo "Tag '$tag' is not a release SemVer tag; skipping."
            echo "matched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "matched=true" >> "$GITHUB_OUTPUT"
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Delete GitHub release
        if: steps.tag.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release found for tag '$TAG'."
            exit 0
          fi
          gh release delete "$TAG" --yes
          echo "Deleted release '$TAG'."
